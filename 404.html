<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>404 · HIMEMIRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F3E5C8'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23C95770'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23F0643B'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23FFF8E9'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", Georgia, serif;
    min-height: 100vh;
    background: radial-gradient(circle at 30% 30%, #fff5f7, transparent 50%),
                radial-gradient(circle at 70% 70%, #ede2f8, transparent 50%),
                #f3e5c8;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px;
  }
  .code { font-size: clamp(72px, 20vw, 160px); font-weight: 900; line-height: 1; color: #3a2424; letter-spacing: -8px; text-shadow: 6px 6px 0 rgba(201,87,112,.4); }
  .emoji { font-size: clamp(48px, 10vw, 96px); margin: 20px 0; }
  .msg { font-size: clamp(14px, 3vw, 18px); color: #3a2424; margin-bottom: 32px; letter-spacing: 1px; }
  .msg-jp { font-family: "M PLUS Rounded 1c", sans-serif; font-size: 12px; color: #c95770; margin-bottom: 32px; letter-spacing: 3px; }
  a.btn {
    display: inline-block;
    background: #fff8e9; border: 2px solid #402a2a; border-radius: 8px 4px 14px 6px;
    box-shadow: 4px 4px 0 rgba(64,42,42,.18);
    padding: 14px 32px; color: #3a2424; text-decoration: none;
    font-size: 14px; letter-spacing: 2px; font-family: "VT323", monospace;
    transition: all .2s;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 6px 6px 0 rgba(64,42,42,.25); background: #ffe0e8; }
  .foot { font-size: 11px; color: #b9a18b; margin-top: 48px; letter-spacing: 3px; font-family: "VT323", monospace; }
</style>
</head>
<body>
  <div class="emoji">☁ ✦</div>
  <div class="code">404</div>
  <div class="msg">这个页面好像跑去云朵上面玩了…</div>
  <div class="msg-jp">ページが雲の上に逃げちゃったみたい…</div>
  <a href="./" class="btn">✦ 回到博物馆 HOME ✦</a>
  <div class="foot">◆ HIMEMIRO · A Magical Dream Factory ◆</div>
</body>
</html>
